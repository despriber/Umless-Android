<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="表达教练：每次说话 → 规则指标 → 每日诊断 → 习惯卡与练习">
<g font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif"><rect x="30.0" y="34" width="198" height="158" rx="16" fill="#252a28" stroke="#2a3330" stroke-width="1.5"/><circle cx="129.0" cy="68" r="15" fill="#173330"/><text x="129.0" y="74" font-size="15" font-weight="700" text-anchor="middle" fill="#5eead4">1</text><text x="129.0" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#eceeed">每次说话</text><text x="129.0" y="147" font-size="14.5" text-anchor="middle" fill="#c0c8c4">逐字稿只存在本机</text><text x="129.0" y="170" font-size="14.5" text-anchor="middle" fill="#c0c8c4">录音默认不保存</text><path d="M234.0 113.0H258.0M251.0 107.0L258.0 113.0L251.0 119.0" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="264.0" y="34" width="198" height="158" rx="16" fill="#252a28" stroke="#2a3330" stroke-width="1.5"/><circle cx="363.0" cy="68" r="15" fill="#173330"/><text x="363.0" y="74" font-size="15" font-weight="700" text-anchor="middle" fill="#5eead4">2</text><text x="363.0" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#eceeed">规则指标</text><text x="363.0" y="147" font-size="14.5" text-anchor="middle" fill="#c0c8c4">口癖 · 重复 · 改口</text><text x="363.0" y="170" font-size="14.5" text-anchor="middle" fill="#c0c8c4">本地即时计算</text><path d="M468.0 113.0H492.0M485.0 107.0L492.0 113.0L485.0 119.0" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="498.0" y="34" width="198" height="158" rx="16" fill="#252a28" stroke="#2a3330" stroke-width="1.5"/><circle cx="597.0" cy="68" r="15" fill="#173330"/><text x="597.0" y="74" font-size="15" font-weight="700" text-anchor="middle" fill="#5eead4">3</text><text x="597.0" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#eceeed">每日诊断</text><text x="597.0" y="147" font-size="14.5" text-anchor="middle" fill="#c0c8c4">流畅 简洁 逻辑 清晰</text><text x="597.0" y="170" font-size="14.5" text-anchor="middle" fill="#c0c8c4">原话 → 更好的说法</text><path d="M702.0 113.0H726.0M719.0 107.0L726.0 113.0L719.0 119.0" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="732.0" y="34" width="198" height="158" rx="16" fill="#252a28" stroke="#2a3330" stroke-width="1.5"/><circle cx="831.0" cy="68" r="15" fill="#173330"/><text x="831.0" y="74" font-size="15" font-weight="700" text-anchor="middle" fill="#5eead4">4</text><text x="831.0" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#eceeed">习惯卡 + 练习</text><text x="831.0" y="147" font-size="14.5" text-anchor="middle" fill="#c0c8c4">最多 3 张进行中</text><text x="831.0" y="170" font-size="14.5" text-anchor="middle" fill="#c0c8c4">每天 5 道口语题</text><path d="M831.0 198V246Q831.0 266 811.0 266H149.0Q129.0 266 129.0 246V208" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M122.0 214L129.0 204L136.0 214" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="310.0" y="249" width="340" height="34" rx="17" fill="#1f2322" stroke="#2a3330" stroke-width="1.5"/><text x="480.0" y="271" font-size="15" text-anchor="middle" fill="#5eead4">第二天说得更干净一点，进度看得见</text></g>
